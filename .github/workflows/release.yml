# Shared release workflow of every aifivem repository (called by each repo's .github/workflows/release.yml).
# release-please reads the Conventional Commits pushed to main and keeps a release pull request open: it bumps
# package.json, CHANGELOG.md and the marked `version` line of fxmanifest.lua. Merging that pull request tags the
# version and publishes the GitHub release with the notes grouped as New Features, Bug Fixes, Performance...
name: release

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
