# Shared release workflow of every aifivem repository (called by each repo's .github/workflows/release.yml with
# `secrets: inherit`). release-please reads the Conventional Commits pushed to main and keeps a release pull request
# open: it bumps package.json and CHANGELOG.md. Merging that pull request tags the version and publishes the GitHub
# release, its notes grouped as New Features, Bug Fixes, Performance..., and a resource's release gets its zip below.
# Every push is posted to the Discord changelog channel, every new release to the release channel (organization
# secrets DISCORD_CHANGELOG_WEBHOOK and DISCORD_RELEASE_WEBHOOK; a missing secret skips its post).
name: release

on:
  workflow_call:
    secrets:
      DISCORD_CHANGELOG_WEBHOOK:
        required: false
      DISCORD_RELEASE_WEBHOOK:
        required: false
    outputs:
      # JSON list of the released paths. aicore-packages publishes them to npm in its own workflow: only that repo
      # grants id-token: write, and npm trusted publishing checks the calling workflow's file name.
      paths_released:
        value: ${{ jobs.release-please.outputs.paths }}

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    if: github.event_name == 'push' && github.event.commits[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Post the pushed commits to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMPARE: ${{ github.event.compare }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          lines=$(echo "$COMMITS" | jq -r '.[] | "[`\(.id[0:7])`](\(.url)) \(.message | split("\n")[0]) - \(.author.username // .author.name)"')
          count=$(echo "$COMMITS" | jq 'length')
          jq -n --arg title "${REPO#*/}: $count new commit(s) on $BRANCH" --arg url "$COMPARE" --arg body "${lines:0:4000}" \
            '{username: "AI Core", embeds: [{title: $title, url: $url, description: $body, color: 4060062}]}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"

  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      paths: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Post new releases to Discord
        if: steps.release.outputs.releases_created == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PATHS: ${{ steps.release.outputs.paths_released }}
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          for path in $(echo "$PATHS" | jq -r '.[]'); do
            if [ "$path" = "." ]; then prefix=""; else prefix="$path--"; fi
            tag=$(echo "$OUTPUTS" | jq -r --arg k "${prefix}tag_name" '.[$k]')
            [ -z "$tag" ] || [ "$tag" = "null" ] && continue
            body=$(gh release view "$tag" --repo "$REPO" --json body --jq .body)
            url=$(gh release view "$tag" --repo "$REPO" --json url --jq .url)
            jq -n --arg title "${REPO#*/} $tag" --arg url "$url" --arg body "${body:0:4000}" \
              '{username: "AI Core", embeds: [{title: $title, url: $url, description: $body, color: 4060062}]}' \
              | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
          done

  # A resource release gets a ready-to-install zip built from source on a clean machine, so a release never depends
  # on someone having committed a fresh dist/. The @aifivem packages come from aicore-packages main, linked
  # through a bun workspace the same way the server folder links them.
  package:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          path: ws/res
      - id: kind
        run: |
          if [ -f ws/res/tsdown.config.ts ]; then echo "resource=true" >> "$GITHUB_OUTPUT"; else echo "resource=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.kind.outputs.resource == 'true'
        uses: actions/checkout@v4
        with:
          repository: aifivem/aicore-packages
          path: ws/packages
      - if: steps.kind.outputs.resource == 'true'
        uses: oven-sh/setup-bun@v2
      - name: Build
        if: steps.kind.outputs.resource == 'true'
        working-directory: ws
        run: |
          members='"packages/*", "res"'
          [ -f res/web/package.json ] && members="$members, \"res/web\""
          echo "{ \"name\": \"release-build\", \"private\": true, \"workspaces\": [ $members ] }" > package.json
          bun install
          cd res && bun run build
      # One download for a server owner: the built files run as they are, and the source next to them builds on its
      # own (`bun install && bun run build` in the folder, the @aifivem packages from npm). Uploaded as
      # <name>-<tag>.zip and as <name>.zip, which releases/latest/download/<name>.zip (the txAdmin recipe) points at.
      # <name>-runtime.zip holds only what the server runs: no source, build setup or AI notes.
      - name: Upload the server zips
        if: steps.kind.outputs.resource == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        working-directory: ws
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          mkdir -p "out/$name"
          # Unanchored patterns match at any depth (web/node_modules too).
          skip=(/.git /.github node_modules /release-please-config.json /.release-please-manifest.json "*.tsbuildinfo" "*.bak" "*.tmp" secrets.json)
          args=()
          for p in "${skip[@]}"; do args+=(--exclude "$p"); done
          rsync -a "${args[@]}" res/ "out/$name/"
          # workspace:* resolves only inside a workspace: pin our packages to the versions this zip was built with, and
          # make web/ the resource's own workspace so one bun install sets up the page's packages too.
          node - "out/$name" packages <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const [dir, pkgs] = process.argv.slice(2);
          const version = (name) =>
            JSON.parse(fs.readFileSync(path.join(pkgs, name.split("/")[1], "package.json"), "utf8")).version;
          const hasWeb = fs.existsSync(path.join(dir, "web/package.json"));
          for (const rel of ["package.json", "web/package.json"]) {
            const file = path.join(dir, rel);
            if (!fs.existsSync(file)) continue;
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const key of ["dependencies", "devDependencies"])
              for (const [name, spec] of Object.entries(json[key] ?? {})) {
                if (!spec.startsWith("workspace:")) continue;
                if (!name.startsWith("@aifivem/")) throw new Error(`${rel}: ${name} is ${spec}`);
                json[key][name] = `^${version(name)}`;
              }
            if (rel === "package.json" && hasWeb) json.workspaces = ["web"];
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
          }
          EOF
          (cd out && zip -qr "../$name-$TAG.zip" "$name")
          cp "$name-$TAG.zip" "$name.zip"
          # Anchored patterns only match at the top (dist/web is the built page, web/ its source).
          runtime=(/.git /.github node_modules /resource /web /scripts /bench /tsdown.config.ts /package.json /bun.lock /.prettierrc /.prettierignore /.gitignore /release-please-config.json /.release-please-manifest.json "/tsconfig*.json" CLAUDE.md "*.tsbuildinfo" "*.bak" "*.tmp" secrets.json)
          args=()
          for p in "${runtime[@]}"; do args+=(--exclude "$p"); done
          mkdir -p "runtime/$name"
          rsync -a "${args[@]}" res/ "runtime/$name/"
          (cd runtime && zip -qr "../$name-runtime.zip" "$name")
          gh release upload "$TAG" "$name-$TAG.zip" "$name.zip" "$name-runtime.zip" --repo "$GITHUB_REPOSITORY" --clobber
